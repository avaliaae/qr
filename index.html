<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Abrindo…</title>
  <style>
    body { font: 16px system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; color: #101828; text-align: center; padding: 16px; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div id="m">Abrindo…</div>
  <script>
    // Endereço do redirecionador (Apps Script, acesso anônimo). Só devolve o destino do código.
    var API = 'https://script.google.com/macros/s/AKfycbwbOLnvmzHfxXWGpTlUvme5V-ggLs1qFJew_KnfvZeup8gARSMqL49H2HBfQFN5LCB0KA/exec';
    var m = document.getElementById('m');
    var codigo = new URLSearchParams(location.search).get('r');

    function falha(msg) { m.textContent = msg; }

    if (!codigo) {
      falha('QR Code inválido.');
    } else {
      fetch(API + '?json=1&r=' + encodeURIComponent(codigo))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && /^https?:\/\//i.test(d.destino || '')) {
            m.innerHTML = '<a id="l">Toque aqui se não abrir sozinho</a>';
            document.getElementById('l').href = d.destino;
            location.replace(d.destino);
          } else {
            falha('Este QR Code não está ativo.');
          }
        })
        .catch(function () { falha('Não foi possível abrir agora. Tente novamente.'); });
    }
  </script>
</body>
</html>
